[package]
name = "penlink-host"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
openh264 = "0.9.9"
png = "0.18.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webrtc = "=0.17.3"
windows = { version = "0.62.2", features = [
    "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading",
    "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Registry", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory",
    "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Display", "Win32_System_IO", "Win32_System_Console",
] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"

[profile.release]
opt-level = 3
debug = "line-tables-only"
